%YAML 1.2
---
# Substrait extension declaring the array-producing and array-consuming scalar
# functions DataFusion's native runtime can execute. Substrait's standard
# extension catalog has no array_* entries, so isthmus' RexExpressionConverter
# would fail with "Unable to convert call …" until we declare them here.
#
# DataFusion's `datafusion-substrait` consumer resolves these names to native
# DataFusion implementations (datafusion-functions-array crate):
#   make_array       → array constructor
#   array_length     → array length
#   array_slice      → array slice (1-based, inclusive)
#   array_distinct   → array distinct elements
#   array_to_string  → join array elements with a separator
urn: extension:org.opensearch:array_functions
scalar_functions:
  - name: make_array
    description: >-
      Construct an array literal from variadic operands. All operands must share
      a common element type (Calcite type-widens at the operator level before
      emission). Returns a list of that element type.
    impls:
      - args:
          - value: any1
            name: element
        variadic:
          min: 0
        return: "list<any1>"

  - name: array_length
    description: >-
      Return the number of elements in the array, or NULL if the array is NULL.
      Calcite's {@code SqlLibraryOperators.ARRAY_LENGTH} lowers to this name.
    impls:
      - args:
          - value: "list<any1>"
            name: array
        return: "i64?"

  - name: array_contains
    description: >-
      Return whether an array contains a scalar element. DataFusion exposes this
      as an alias of its native array_has function. NULL arrays or elements
      produce a nullable boolean result.
    impls:
      - args:
          - value: "list<any1>"
            name: array
          - value: "any1"
            name: element
        return: "boolean?"

  - name: array_any_compare
    description: >-
      Return true when any non-null string element satisfies gt, gte, lt, lte,
      like, ilike, or regex against the supplied scalar value.
    impls:
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: value
          - value: "string"
            name: operation
        return: "boolean?"

  - name: array_any_between
    description: >-
      Return true when any non-null string element is within inclusive bounds.
    impls:
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: lower
          - value: "string"
            name: upper
        return: "boolean?"

  - name: array_map_string
    description: >-
      Element-wise application of a scalar string function to an ARRAY<STRING>,
      returning ARRAY<STRING>. The second operand is a literal naming the base
      function: upper, lower, trim, ltrim, rtrim, substring, replace, or reverse.
      Any remaining operands are that function's extra scalar arguments (e.g.
      substring's start/length, replace's from/to). Order and null elements are
      preserved; an empty array yields an empty array; a null array yields a null
      array. Backed by a custom Rust UDF on the analytics-backend-datafusion
      plugin (no DataFusion stdlib equivalent maps a named scalar over a list).
    impls:
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: function
        return: "list<string?>"
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: function
          - value: "i32"
            name: start
        return: "list<string?>"
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: function
          - value: "i32"
            name: start
          - value: "i32"
            name: length
        return: "list<string?>"
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: function
          - value: "string"
            name: from
          - value: "string"
            name: to
        return: "list<string?>"

  - name: array_map_integer
    description: >-
      Element-wise application of an integer-returning scalar string function to
      an ARRAY<STRING>, returning ARRAY<INTEGER>. The second operand is a literal
      naming the base function: length, ascii, position, or locate. Order and null
      elements are preserved; empty array → empty array; null array → null array.
      Backed by a custom Rust UDF on the analytics-backend-datafusion plugin.
    impls:
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: function
        return: "list<i32?>"
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: function
          - value: "string"
            name: needle
        return: "list<i32?>"
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: function
          - value: "string"
            name: needle
          - value: "i32"
            name: start
        return: "list<i32?>"

  - name: array_nullif
    description: >-
      Element-wise NULLIF(array, scalar): replace every element equal to the
      scalar with null, preserving order and length. A null array yields a null
      array. Backed by a custom Rust UDF on the analytics-backend-datafusion
      plugin.
    impls:
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: value
        return: "list<string?>"

  - name: array_coalesce
    description: >-
      COALESCE(array, scalar): return the array when it is non-null, otherwise a
      singleton array containing the scalar fallback. Backed by a custom Rust UDF
      on the analytics-backend-datafusion plugin.
    impls:
      - args:
          - value: "list<string>"
            name: array
          - value: "string"
            name: fallback
        return: "list<string?>"

  - name: array_slice
    description: >-
      Return a sub-array slice [from, to] (1-based, inclusive on both ends).
      Calcite's {@code SqlLibraryOperators.ARRAY_SLICE} lowers to this name.
    impls:
      - args:
          - value: "list<any1>"
            name: array
          - value: "i64"
            name: from
          - value: "i64"
            name: to
        return: "list<any1>"
      - args:
          - value: "list<any1>"
            name: array
          - value: "i32"
            name: from
          - value: "i32"
            name: to
        return: "list<any1>"

  - name: array_distinct
    description: >-
      Return the array with duplicate elements removed (preserving first occurrence).
      Calcite's {@code SqlLibraryOperators.ARRAY_DISTINCT} lowers to this name.
    impls:
      - args:
          - value: "list<any1>"
            name: array
        return: "list<any1>"

  - name: array_element
    description: >-
      Return the element at the given 1-based position. Calcite's
      {@code SqlStdOperatorTable.ITEM} (used by PPL's {@code mvindex(arr, N)}
      single-element form via {@code MVIndexFunctionImp.resolveSingleElement})
      renames to this for DataFusion. Returns null if the index is out of range.
    impls:
      - args:
          - value: "list<any1>"
            name: array
          - value: "i64"
            name: index
        return: "any1?"

  - name: mvappend
    description: >-
      Flatten a list of arrays into one array, dropping null arrays and null
      elements within array arguments. Returns NULL if no non-null elements
      were collected. PPL surface is {@code mvappend(arg1, arg2, …)} which
      accepts mixed scalar+array operands; the Java adapter wraps each
      scalar in a singleton {@code make_array(…)} call so by the time the
      Rust UDF sees the operands they're uniformly arrays. Backed by a custom
      Rust UDF on the analytics-backend-datafusion plugin (DataFusion's
      array_concat preserves nulls — different semantics).
    impls:
      - args:
          - value: "list<any1?>"
            name: arg
        variadic:
          min: 1
        return: "list<any1?>"

  - name: mvfind
    description: >-
      Find the 0-based index of the first array element matching a regex pattern,
      or NULL if no match. NULL elements are skipped (not matched). PPL surface is
      {@code mvfind(arr, regex)}; registered as a custom Rust UDF on the
      analytics-backend-datafusion plugin (no DataFusion stdlib equivalent).
    impls:
      - args:
          - value: "list<any1>"
            name: array
          - value: "string"
            name: pattern
        return: "i32?"

  - name: mvzip
    description: >-
      Element-wise zip of two arrays into a list of strings, joined per pair
      by a separator (default ","). Result length is min(len(left), len(right))
      (Python-zip truncation). Element NULLs render as empty strings; either
      array NULL → NULL result. PPL surface is {@code mvzip(left, right [, sep])};
      registered as a custom Rust UDF on the analytics-backend-datafusion plugin
      (no DataFusion stdlib equivalent).
    impls:
      - args:
          - value: "list<any1>"
            name: left
          - value: "list<any2>"
            name: right
        return: "list<string?>"
      - args:
          - value: "list<any1>"
            name: left
          - value: "list<any2>"
            name: right
          - value: "string"
            name: separator
        return: "list<string?>"

  - name: array_to_string
    description: >-
      Join array elements into a single string using a separator. Calcite's
      {@code SqlLibraryOperators.ARRAY_JOIN} renames to this for DataFusion.
    impls:
      - args:
          - value: "list<any1>"
            name: array
          - value: "string"
            name: separator
        return: "string?"
      - args:
          - value: "list<any1>"
            name: array
          - value: "varchar<L1>"
            name: separator
        return: "string?"
